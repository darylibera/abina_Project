<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Abina</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <div class="logo">ABINA ADMIN</div>
  <ul><li><a href="index.html">← Site</a></li><li><a href="#" id="logoutBtn" style="display:none">Logout</a></li></ul>
</nav>

<section id="loginBox" class="section">
  <h2>Admin Login</h2>
  <form id="loginForm" class="form">
    <input type="email" id="email" placeholder="Admin Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" class="btn">Login</button>
    <p id="loginStatus"></p>
  </form>
</section>

<section id="dashboard" class="section" style="display:none">
  <h2>Admin Dashboard</h2>
  <div class="tabs">
    <button data-tab="users" class="active">Users</button>
    <button data-tab="bookings">Bookings</button>
    <button data-tab="designs">Designs</button>
    <button data-tab="messages">Messages</button>
    <button data-tab="reviews">Reviews</button>
  </div>
  <div id="adminContent"></div>
</section>

<footer><p>© 2026 Abina Interior Design Studio</p></footer>

<script src="js/admin.js"></script>
</body>
</html>
