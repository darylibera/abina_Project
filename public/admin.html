<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Abina</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <div class="logo">Abina Admin</div>
  <ul>
    <li><a href="index.html">← Back to Site</a></li>
    <li><a href="#" id="logoutBtn" style="display:none">Logout</a></li>
  </ul>
</nav>

<!-- LOGIN -->
<section id="loginBox" class="section">
  <h2>Admin Login</h2>
  <form id="loginForm" class="form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" class="btn">Login</button>
  </form>
  <p id="loginStatus"></p>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="section" style="display:none">
  <h2>Manage Designs</h2>
  <form id="designForm" class="form">
    <input type="text" id="title" placeholder="Title" required>
    <input type="text" id="category" placeholder="Category (e.g. Living Room)" required>
    <input type="text" id="image" placeholder="Image URL" required>
    <textarea id="description" placeholder="Description" required></textarea>
    <button type="submit" class="btn">Add Design</button>
  </form>
  <h3>Existing Designs</h3>
  <div id="adminGallery" class="gallery"></div>

  <h2 style="margin-top:40px">Messages</h2>
  <div id="messages"></div>
</section>

<footer><p>© 2026 Abina Interior Design Studio</p></footer>

<script src="js/admin.js"></script>
</body>
</html>
