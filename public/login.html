<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — Abina</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav><div class="logo">ABINA</div><ul><li><a href="index.html">Home</a></li><li><a href="register.html">Register</a></li></ul></nav>

<section class="section">
  <h2>Login</h2>
  <form id="loginForm" class="form">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn">Login</button>
    <p id="loginStatus"></p>
    <p style="font-size:14px;color:#666">New here? <a href="register.html" style="color:#1f3a2e">Create an account</a></p>
  </form>
</section>

<footer><p>© 2026 Abina Interior Design Studio</p></footer>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const res = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email: f.email.value, password: f.password.value })
  });
  const data = await res.json();
  const status = document.getElementById('loginStatus');
  if (data.success) {
    localStorage.setItem('abinaUser', JSON.stringify(data.user));
    status.className = 'alert alert-success';
    status.textContent = '✅ Login successful! Redirecting...';
    setTimeout(() => location.href = 'dashboard.html', 800);
  } else {
    status.className = 'alert alert-error';
    status.textContent = '❌ ' + data.message;
  }
});
</script>
</body>
</html>
